workflows:
  android-apk:
    name: Vycustic APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate android folder
        script: |
          flutter create --org com.arvirmdn --project-name vycustic --platforms=android .
      - name: Patch manifest (internet, background audio, nama app)
        script: python3 tool/patch_manifest.py
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
